<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong — Retro Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", monospace;
      background: #080b10;
      color: #e9f4ed;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 40%, #18241f 0%, #0c1112 50%, #080b10 100%);
    }

    main { width: min(100%, 960px); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
    }

    h1 {
      margin: 0;
      color: #a7ffbd;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      letter-spacing: .18em;
      text-shadow: 0 0 18px #65ff8b55;
    }

    .subtitle {
      margin: 6px 0 0;
      color: #91a398;
      font-size: .82rem;
      letter-spacing: .08em;
    }

    .status {
      color: #a7ffbd;
      font-size: .75rem;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .frame {
      position: relative;
      overflow: hidden;
      border: 1px solid #385443;
      border-radius: 8px;
      background: #090e0d;
      box-shadow: 0 0 40px #4aff7414, 0 20px 70px #0009;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 900 / 560;
      cursor: crosshair;
      touch-action: none;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: #829287;
      font-size: .75rem;
      letter-spacing: .04em;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid #425448;
      border-radius: 4px;
      color: #c9f8d3;
      background: #111915;
      font: inherit;
    }

    @media (max-width: 560px) {
      body { padding: 16px; }
      header { align-items: start; flex-direction: column; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>PONG</h1>
        <p class="subtitle">A little retro. A lot of rally.</p>
      </div>
      <div class="status" id="status">READY</div>
    </header>

    <div class="frame">
      <canvas id="game" width="900" height="560" aria-label="Pong game court"></canvas>
    </div>

    <footer>
      <span>Move: <kbd>↑</kbd> <kbd>↓</kbd> or mouse</span>
      <span>Pause: <kbd>Space</kbd></span>
      <span>First to 7 wins</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const status = document.querySelector("#status");

      const W = canvas.width;
      const H = canvas.height;
      const paddle = { w: 12, h: 92, speed: 500 };
      const player = { x: 34, y: H / 2 - paddle.h / 2, score: 0 };
      const ai = { x: W - 34 - paddle.w, y: H / 2 - paddle.h / 2, score: 0 };
      const ball = { x: W / 2, y: H / 2, r: 8, vx: 0, vy: 0 };

      let keys = new Set();
      let lastTime = 0;
      let serveAt = performance.now() + 900;
      let paused = false;
      let gameOver = false;
      let mouseY = null;
      let rally = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resetBall(direction) {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
        rally = 0;
        serveAt = performance.now() + 950;
        ball.serveDirection = direction;
        status.textContent = "GET READY!";
      }

      function serve(now) {
        if (now < serveAt || paused || gameOver) return;
        const direction = ball.serveDirection || (Math.random() < 0.5 ? -1 : 1);
        const angle = (Math.random() * 0.7 - 0.35);
        const speed = 390;
        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
        status.textContent = "IN PLAY";
      }

      function predictAiY() {
        if (ball.vx <= 0) return H / 2 - paddle.h / 2;

        const distance = ai.x - ball.x;
        const timeToPaddle = distance / ball.vx;
        let predicted = ball.y + ball.vy * timeToPaddle;

        // Reflect the predicted position as if the ball bounces off top/bottom.
        const span = H - ball.r * 2;
        let folded = (predicted - ball.r) % (span * 2);
        if (folded < 0) folded += span * 2;
        if (folded > span) folded = span * 2 - folded;

        // A little inaccuracy keeps the opponent challenging but beatable.
        return folded + ball.r - paddle.h / 2;
      }

      function update(dt, now) {
        if (paused || gameOver) return;

        if (ball.vx === 0 && now >= serveAt) serve(now);

        if (keys.has("ArrowUp")) player.y -= paddle.speed * dt;
        if (keys.has("ArrowDown")) player.y += paddle.speed * dt;

        if (mouseY !== null && !keys.has("ArrowUp") && !keys.has("ArrowDown")) {
          const target = mouseY - paddle.h / 2;
          player.y += clamp(target - player.y, -paddle.speed * dt, paddle.speed * dt);
        }

        player.y = clamp(player.y, 0, H - paddle.h);

        const aiTarget = ball.vx > 0 ? predictAiY() : H / 2 - paddle.h / 2;
        const aiSpeed = 315 + Math.min(rally * 5, 95);
        ai.y += clamp(aiTarget - ai.y, -aiSpeed * dt, aiSpeed * dt);
        ai.y = clamp(ai.y, 0, H - paddle.h);

        if (ball.vx === 0) return;

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y - ball.r <= 0) {
          ball.y = ball.r;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + ball.r >= H) {
          ball.y = H - ball.r;
          ball.vy = -Math.abs(ball.vy);
        }

        hitPaddle(player, 1);
        hitPaddle(ai, -1);

        if (ball.x + ball.r < 0) {
          ai.score++;
          checkWinner();
          if (!gameOver) resetBall(1);
        } else if (ball.x - ball.r > W) {
          player.score++;
          checkWinner();
          if (!gameOver) resetBall(-1);
        }
      }

      function hitPaddle(p, direction) {
        const overlapsY = ball.y + ball.r >= p.y && ball.y - ball.r <= p.y + paddle.h;
        const overlapsX = direction > 0
          ? ball.x - ball.r <= p.x + paddle.w && ball.x > p.x
          : ball.x + ball.r >= p.x && ball.x < p.x + paddle.w;

        if (!overlapsX || !overlapsY || Math.sign(ball.vx) !== -direction) return;

        const offset = clamp((ball.y - (p.y + paddle.h / 2)) / (paddle.h / 2), -1, 1);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.055, 820);
        const angle = offset * (Math.PI / 3);
        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
        ball.x = direction > 0 ? p.x + paddle.w + ball.r : p.x - ball.r;
        rally++;
      }

      function checkWinner() {
        if (player.score >= 7 || ai.score >= 7) {
          gameOver = true;
          status.textContent = player.score > ai.score ? "YOU WIN!" : "COMPUTER WINS";
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#090e0d";
        ctx.fillRect(0, 0, W, H);

        // Court markings and center line.
        ctx.strokeStyle = "#294033";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 14]);
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);

        // Scoreboard.
        ctx.fillStyle = "#a7ffbd";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = "bold 62px 'Courier New', monospace";
        ctx.shadowColor = "#65ff8b";
        ctx.shadowBlur = 18;
        ctx.fillText(player.score, W / 2 - 60, 30);
        ctx.fillText(ai.score, W / 2 + 60, 30);
        ctx.shadowBlur = 0;

        // Paddles and ball.
        ctx.fillStyle = "#b8ffd0";
        ctx.shadowColor = "#74ff9a";
        ctx.shadowBlur = 16;
        ctx.fillRect(player.x, player.y, paddle.w, paddle.h);
        ctx.fillRect(ai.x, ai.y, paddle.w, paddle.h);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (paused || gameOver || ball.vx === 0) {
          ctx.fillStyle = "#c8dfcf";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "bold 21px 'Courier New', monospace";
          const message = gameOver
            ? "PRESS ENTER TO PLAY AGAIN"
            : paused
              ? "PAUSED"
              : "GET READY!";
          ctx.fillText(message, W / 2, H / 2 + 72);
        }
      }

      function frame(now) {
        const dt = Math.min((now - lastTime) / 1000 || 0, 0.032);
        lastTime = now;
        update(dt, now);
        draw();
        requestAnimationFrame(frame);
      }

      function restart() {
        player.score = 0;
        ai.score = 0;
        player.y = ai.y = H / 2 - paddle.h / 2;
        paused = false;
        gameOver = false;
        resetBall(Math.random() < 0.5 ? -1 : 1);
      }

      canvas.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        mouseY = (event.clientY - rect.top) * H / rect.height;
      });

      canvas.addEventListener("pointerleave", () => { mouseY = null; });

      window.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", " "].includes(event.key)) event.preventDefault();

        if (event.key === "Enter" && gameOver) {
          restart();
          return;
        }
        if (event.key === " " && !gameOver) {
          paused = !paused;
          status.textContent = paused ? "PAUSED" : (ball.vx ? "IN PLAY" : "GET READY!");
          return;
        }
        keys.add(event.key);
      });

      window.addEventListener("keyup", (event) => keys.delete(event.key));
      window.addEventListener("blur", () => keys.clear());

      resetBall(Math.random() < 0.5 ? -1 : 1);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
